<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SMS Data Explorer (Pro Preview)</title>
    <link href="https://fonts.googleapis.com/icon?family=Material+Icons+Round" rel="stylesheet">
    <style>
        :root { --primary: #4285F4; --bg: #f8f9fa; --text: #202124; }
        body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
        .container { max-width: 1100px; margin: 0 auto; background: white; padding: 25px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.1); }
        .upload-section { border: 3px dashed #cbd5e1; padding: 40px; text-align: center; border-radius: 10px; cursor: pointer; background: #fff; transition: 0.3s; }
        .upload-section:hover { border-color: var(--primary); background: #f1f7ff; }
        .layout { display: grid; grid-template-columns: 350px 1fr; gap: 20px; margin-top: 20px; height: 600px; }
        .panel { display: flex; flex-direction: column; border: 1px solid #e2e8f0; border-radius: 8px; background: #fff; overflow: hidden; }
        .panel-header { background: #f8fafc; padding: 12px; font-weight: bold; border-bottom: 1px solid #e2e8f0; display: flex; justify-content: space-between; align-items: center; }
        .search-box { padding: 10px; border-bottom: 1px solid #e2e8f0; }
        #senderSearch { width: 100%; padding: 8px; border: 1px solid #cbd5e1; border-radius: 5px; box-sizing: border-box; }
        .list-items { flex: 1; overflow-y: auto; padding: 5px; }
        .sender-item { display: flex; align-items: center; padding: 8px; border-radius: 5px; cursor: pointer; font-size: 13px; transition: 0.2s; }
        .sender-item:hover { background: #f1f5f9; }
        .sender-item input { margin-right: 12px; transform: scale(1.2); }
        
        .preview-content { 
            flex: 1; 
            overflow-y: auto; 
            padding: 20px; 
            background: #e5ddd5; 
            display: flex;
            flex-direction: column;
            gap: 12px;
        }
        .sms-bubble { 
            max-width: 85%;
            padding: 10px 14px; 
            border-radius: 18px; 
            border-top-left-radius: 4px; 
            box-shadow: 0 1px 0.5px rgba(0,0,0,0.13); 
            font-size: 14px; 
            line-height: 1.5;
            background: white; 
            align-self: flex-start;
        }
        .sender-info {
            display: flex;
            justify-content: space-between;
            margin-bottom: 4px;
            font-size: 11px;
            font-weight: 800;
            border-bottom: 1px solid #eee;
            padding-bottom: 2px;
        }
        .msg-text { color: #333; white-space: pre-wrap; }

        .code-area { margin-top: 20px; background: #1e293b; border-radius: 8px; padding: 15px; position: relative; }
        .code-area pre { color: #4ade80; font-size: 12px; margin: 0; white-space: pre-wrap; word-break: break-all; font-family: 'Consolas', monospace; }
        .copy-btn { position: absolute; top: 10px; right: 10px; background: var(--primary); color: white; border: none; padding: 6px 15px; border-radius: 5px; cursor: pointer; font-weight: bold; }
        .hidden { display: none; }
    </style>
</head>
<body>

<div class="container">
    <h2>📱 SMS Explorer & Script Generator</h2>
    <div class="upload-section" onclick="document.getElementById('fileInput').click()">
        <i class="material-icons-round" style="font-size: 48px; color: #94a3b8;">upload_file</i>
        <p id="statusTxt">Click to upload <b>my_messages_full.txt</b></p>
        <input type="file" id="fileInput" class="hidden" accept=".txt">
    </div>

    <div id="mainUI" class="hidden">
        <div class="layout">
            <div class="panel">
                <div class="panel-header">
                    <span>Senders</span>
                    <div style="display:flex; gap:5px;">
                        <button onclick="toggleAll(true)" style="font-size:10px; cursor:pointer;">All</button>
                        <button onclick="toggleAll(false)" style="font-size:10px; cursor:pointer;">None</button>
                    </div>
                </div>
                <div class="search-box">
                    <input type="text" id="senderSearch" placeholder="Search sender..." oninput="filterList()">
                </div>
                <div class="list-items" id="senderList"></div>
            </div>
            <div class="panel">
                <div class="panel-header">Clean Message Preview</div>
                <div class="preview-content" id="previewArea">Select a sender...</div>
            </div>
        </div>
        <div class="code-area">
            <button class="copy-btn" onclick="copyScript()">Copy Script</button>
            <pre id="scriptDisplay"># Select senders to generate script...</pre>
        </div>
    </div>
</div>

<script>
    let allData = new Map();

    document.getElementById('fileInput').onchange = (e) => {
        const file = e.target.files[0];
        if (!file) return;
        const reader = new FileReader();
        document.getElementById('statusTxt').innerText = "Analyzing...";
        reader.onload = (event) => processRawText(event.target.result);
        reader.readAsText(file);
    };

    function processRawText(text) {
        allData.clear();
        // Handle the Rupee encoding error immediately
        const fixedText = text.replace(/Γé╣/g, '₹');
        const entries = fixedText.split(/Row:\s*\d+/);
        
        entries.forEach(entry => {
            const addrMatch = entry.match(/address=([^,]+)/i);
            // Matches body but stops before system fields like service_center, locked, etc.
            const bodyMatch = entry.match(/body=(.*?)(?=(?:,\s*\w+=)|$)/is);
            
            if (addrMatch && bodyMatch) {
                const sender = addrMatch[1].trim();
                let cleanBody = bodyMatch[1].trim();

                if (!allData.has(sender)) allData.set(sender, []);
                allData.get(sender).push(cleanBody);
            }
        });
        
        renderList();
        document.getElementById('mainUI').classList.remove('hidden');
        document.getElementById('statusTxt').innerText = "File loaded!";
    }

    function renderList() {
        const list = document.getElementById('senderList');
        list.innerHTML = "";
        Array.from(allData.keys()).sort().forEach(sender => {
            const div = document.createElement('div');
            div.className = "sender-item";
            div.setAttribute('data-name', sender.toLowerCase());
            div.innerHTML = `<input type="checkbox" value="${sender}" onchange="updateUI()"><span onclick="this.previousElementSibling.click();" style="flex:1; cursor:pointer;">${sender} (${allData.get(sender).length})</span>`;
            list.appendChild(div);
        });
        updateUI();
    }

    function getSenderColor(name) {
        let hash = 0;
        for (let i = 0; i < name.length; i++) {
            hash = name.charCodeAt(i) + ((hash << 5) - hash);
        }
        return `hsl(${Math.abs(hash) % 360}, 70%, 35%)`; 
    }

    function updateUI() {
        const selected = Array.from(document.querySelectorAll('.sender-item input:checked')).map(i => i.value);
        const preview = document.getElementById('previewArea');
        
        if (selected.length === 0) {
            preview.innerHTML = "<div style='text-align:center; color:#888; margin-top:20px;'>Select a sender from the list.</div>";
            document.getElementById('scriptDisplay').innerText = "# Select senders...";
            return;
        }
        
        let html = "";
        selected.forEach(s => {
            const color = getSenderColor(s);
            allData.get(s).forEach(m => {
                html += `
                <div class="sms-bubble">
                    <div class="sender-info" style="color: ${color}">
                        <span>FROM: ${s}</span>
                    </div>
                    <div class="msg-text">${m}</div>
                </div>`;
            });
        });
        preview.innerHTML = html;

        const pattern = selected.join('|').replace(/\+/g, '\\+');
        document.getElementById('scriptDisplay').innerText = `$results = Get-Content .\\my_messages_full.txt | Where-Object { $_ -match "${pattern}" } | ForEach-Object { 
    $raw = $_ -replace 'Γé╣', '₹'
    $amt = ([regex]::Match($raw, '(?:Rs\\.?|INR|₹)\\s?([\\d,.]+)')).Groups[1].Value.Replace(',', ''); 
    $merch = ([regex]::Match($raw, '(?:at|to|spent on)\\s+(.*?)\\s+(?:on|using|at)')).Groups[1].Value.Trim(); 
    $sender = ([regex]::Match($raw, 'address=([^, ]+)')).Groups[1].Value;
    if (!$merch) { $merch = "Manual Check" }
    if ($amt) { 
        [PSCustomObject]@{ merch=$merch; amt=[float]$amt; date=(Get-Date -Format "yyyy-MM-dd"); mcc="ADB"; card=$sender } 
    } 
}
$jsonData = ,$results | ConvertTo-Json
[System.IO.File]::WriteAllText((Join-Path (Get-Location) "CUSTOM_IMPORT.json"), $jsonData)`;
    }

    function filterList() {
        const query = document.getElementById('senderSearch').value.toLowerCase();
        document.querySelectorAll('.sender-item').forEach(item => {
            item.classList.toggle('hidden', !item.getAttribute('data-name').includes(query));
        });
    }

    function toggleAll(val) {
        document.querySelectorAll('.sender-item:not(.hidden) input').forEach(i => i.checked = val);
        updateUI();
    }

    function copyScript() {
        navigator.clipboard.writeText(document.getElementById('scriptDisplay').innerText);
        alert("Script copied!");
    }
</script>
</body>
</html>
